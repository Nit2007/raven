<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gemini Browser Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Gemini Browser Agent</h1>
  <textarea id="task" rows="3" placeholder="e.g. Search this page for &quot;contact&quot; and click the first match"></textarea>
  <div class="row">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="m1Btn" style="background: #0891b2;" title="Trigger M1 Viewport Capture">Capture M1</button>
    <button id="m2Btn" style="background: #2563eb;" title="Trigger M2 DOM Analysis">Analyze M2</button>
  </div>
  <div id="confirmBox" class="confirm-box" hidden>
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmBtn">Confirm</button>
      <button id="cancelBtn">Cancel</button>
    </div>
  </div>
  <div id="status" class="status">Idle</div>
  <ol id="log"></ol>
  
  <!-- Agent Commentary Section -->
  <div id="commentary-section" style="margin-top: 15px; border-top: 2px solid #4CAF50; padding-top: 10px; display: none;">
    <div style="font-weight: bold; color: #2E7D32; margin-bottom: 5px;">🤖 Agent Insights:</div>
    <div id="agent-commentary" style="font-style: italic; color: #333; font-size: 13px; line-height: 1.4; min-height: 40px;">
      Waiting for analysis...
    </div>
  </div>

  <a id="optionsLink" href="#">API keys / options</a>
  <script src="popup.js"></script>
</body>
</html>
